# Récupère les données du Parlement chaque matin et les publie en fichiers.
#
# C'est la « solution A » du §10 du plan : pas de serveur à louer. GitHub
# exécute le programme, publie le résultat, et le sert. L'application lit
# ensuite des fichiers, sans rien avoir à demander à personne.
#
# Deux réglages sont à faire une fois, à la main, dans le dépôt — une session
# Claude Code n'y a pas accès :
#   Settings → Actions → General   : autoriser les workflows
#   Settings → Pages → Source      : choisir « GitHub Actions »
#
# Adresse des fichiers une fois publiés :
#   https://<compte>.github.io/<dépôt>/textes.json

name: Données du Parlement

on:
  schedule:
    # 05h30 UTC, soit 7h30 à Paris en été. L'Assemblée régénère son archive
    # dans la nuit : à cette heure-là, les données de la veille sont en place.
    - cron: "30 5 * * *"
  workflow_dispatch:          # permet de lancer à la main depuis le téléphone
  push:
    branches: [main]
    paths:
      - "socle/**"
      - "maquette/**"        # la maquette est publiée comme page d'accueil
      - ".github/workflows/donnees.yml"

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; une nouvelle n'annule pas celle en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verifier:
    name: Vérifier les règles de classement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        working-directory: socle
        run: |
          python test_extraction.py
          python test_legi.py
          python test_textes.py

  publier:
    name: Récupérer et publier
    needs: verifier
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # La base du Parlement se garde d'une publication à l'autre, comme les
      # deux autres. Ce n'est pas une optimisation gratuite : une modification
      # de la maquette déclenche une publication, et retélécharger 412 Mo
      # d'archives pour republier une page HTML coûtait 1 min 40 à chaque fois.
      #
      # **L'empreinte des trois fichiers qui décident du contenu de la base
      # fait partie de la clé** — le schéma, les règles de lecture, le
      # programme de récupération. Changer une règle change la clé, aucun cache
      # ne correspond, et la récupération complète se refait d'elle-même :
      # sinon on publierait une base remplie selon les anciennes règles. Même
      # raisonnement que pour le droit consolidé, où le cas s'est produit.
      #
      # La base pèse 354 Mo, 90 Mo compressée : à cette taille, la réécrire à
      # chaque publication coûterait une partie du temps qu'on vient de gagner.
      # D'où `restore` et `save` séparés — on ne la réenregistre qu'après une
      # vraie récupération, pas après une republication de la maquette.
      - name: Retrouver la base du Parlement de la veille
        id: cache-parlement
        uses: actions/cache/restore@v4
        env:
          REGLES: ${{ hashFiles('socle/schema.sql', 'socle/extraction.py',
                                'socle/recuperer.py') }}
        with:
          path: socle/parlement.db
          key: parlement-${{ env.REGLES }}-${{ github.run_id }}
          restore-keys: parlement-${{ env.REGLES }}-

      # Les données du jour ne se récupèrent que le matin, ou à la demande, ou
      # faute de cache — sinon il n'y aurait rien à publier. Une modification
      # de code republie donc les données de la veille, et **le bas de page
      # affiche la date de ces données**, pas celle de la mise en ligne : la
      # page ne doit jamais se donner pour plus fraîche qu'elle n'est.
      #
      # L'archive des amendements pèse 297 Mo et n'arrive pas toujours d'un
      # coup : deux publications du 2026-08-31 ont échoué sur une coupure, à
      # 2,6 Mo puis à 51,7 Mo. Le programme reprend maintenant un transfert
      # coupé là où il s'est arrêté ; ce second filet rattrape le cas où il
      # renonce quand même, plutôt que de laisser le site d'hier en ligne.
      #
      # **Il ne rattrape que les sources obligatoires, et c'est structurel** :
      # une exécution où une source facultative manque *réussit*, donc la
      # boucle ci-dessous s'arrête au premier tour sans rien reprendre. C'est
      # ce qui a fait perdre les amendements du site trois fois sur six, du
      # 2026-09-20 au 2026-09-23. La reprise des sources facultatives se joue
      # donc dans `recuperer.py`, sur la source elle-même — redemander 300 Mo
      # coûte moins cher que de retélécharger les 412 Mo de l'ensemble.
      - name: Récupérer les dossiers législatifs
        id: recuperation
        if: ${{ github.event_name != 'push'
                || steps.cache-parlement.outputs.cache-matched-key == '' }}
        working-directory: socle
        run: |
          for essai in 1 2 3; do
            python recuperer.py && exit 0
            echo "::warning::récupération en échec (essai $essai sur 3)"
            sleep $((essai * 30))
          done
          exit 1

      - name: Garder la base du Parlement pour la prochaine fois
        if: ${{ steps.recuperation.outcome == 'success' }}
        uses: actions/cache/save@v4
        env:
          REGLES: ${{ hashFiles('socle/schema.sql', 'socle/extraction.py',
                                'socle/recuperer.py') }}
        with:
          path: socle/parlement.db
          key: parlement-${{ env.REGLES }}-${{ github.run_id }}

      - name: Dire quelles données sont publiées
        working-directory: socle
        run: |
          python - <<'PY'
          import sqlite3
          cx = sqlite3.connect("parlement.db")
          cx.row_factory = sqlite3.Row
          ligne = cx.execute("SELECT fin, statut FROM journal"
                             " ORDER BY id DESC LIMIT 1").fetchone()
          print(f"Données récupérées le {ligne['fin']} ({ligne['statut']})"
                if ligne else "Aucun chargement enregistré")
          PY

      # Le droit consolidé se garde d'un jour sur l'autre. La première passe lit
      # un socle de 1,1 Go — quinze minutes, mesurées — et n'a pas à être
      # refaite : seules les archives quotidiennes de 1 à 4 Mo s'y ajoutent
      # ensuite. Sans ce cache, on relirait le socle chaque matin pour rien.
      #
      # **L'empreinte des règles fait partie de la clé, et c'est indispensable.**
      # La base ne garde que ce que les règles retenaient le jour où elle a été
      # remplie : changer `legi.py` sans jeter le cache laisserait en ligne une
      # base d'hier, à qui les nouvelles règles ne s'appliqueraient plus qu'aux
      # archives du jour. Constaté en ajoutant les articles propres des lois le
      # 2026-09-03 : le correctif n'aurait rien changé pour les lois anciennes.
      # Avec l'empreinte, une modification des règles refait la passe complète
      # une fois, toute seule — personne n'a à y penser.
      - name: Retrouver le droit consolidé de la veille
        uses: actions/cache@v4
        env:
          REGLES: ${{ hashFiles('socle/legi.py', 'socle/recuperer_legi.py') }}
        with:
          path: socle/legi.db
          key: legi-${{ env.REGLES }}-${{ github.run_id }}
          restore-keys: legi-${{ env.REGLES }}-

      # Facultatif, et volontairement : sans lui, tout le reste se publie et
      # l'application n'affiche simplement pas ce que les lois changent. Une
      # panne du dépôt de la DILA ne doit pas laisser le site d'hier en ligne.
      - name: Récupérer ce que les lois changent au droit
        working-directory: socle
        continue-on-error: true
        timeout-minutes: 90
        run: python recuperer_legi.py

      # Le texte des versions successives d'un texte de loi. Même principe que
      # le droit consolidé : la base se garde d'un jour sur l'autre, et chaque
      # exécution n'ajoute que ce qui manque. Tout lire demande 50 minutes
      # (2 295 documents, un appel par seconde) ; on en prend 20 par jour,
      # donc tout est là au bout de trois publications. Un texte publié ne
      # change plus : ce qui est lu ne se relit jamais.
      - name: Retrouver les textes lus les jours précédents
        uses: actions/cache@v4
        env:
          REGLES: ${{ hashFiles('socle/textes.py', 'socle/recuperer_textes.py') }}
        with:
          path: socle/textes.db
          key: textes-${{ env.REGLES }}-${{ github.run_id }}
          restore-keys: textes-${{ env.REGLES }}-

      # Facultatif au même titre : sans lui, la fiche d'un texte s'affiche
      # sans ses versions, et le dit.
      - name: Lire le texte des nouvelles versions
        working-directory: socle
        continue-on-error: true
        timeout-minutes: 30
        run: python recuperer_textes.py --minutes 20

      - name: Écrire les fichiers à publier
        working-directory: socle
        run: python publier.py

      - name: Refuser de publier des données vides
        working-directory: socle
        run: |
          python - <<'PY'
          import json, sys, pathlib
          etat = json.loads(pathlib.Path("public/etat.json").read_text(encoding="utf-8"))
          if etat["textesEnCours"] < 500:
              sys.exit(f"Seulement {etat['textesEnCours']} textes en cours : "
                       "quelque chose a mal tourné, on ne publie pas.")
          print(f"{etat['textesEnCours']} textes en cours, "
                f"{etat['promulgues']} lois promulguées.")
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: socle/public
      - id: deploiement
        uses: actions/deploy-pages@v4
